# Test overrides, layered over src/main/resources/application.yaml.
orange:
  runs:
    # Tests drive the run executors directly. A test that needs the scheduler, reactor or reaper
    # turns the loop on itself.
    loop-enabled: false
  events:
    # Tests call EventProcessor.drain() themselves.
    processing-enabled: false
  attention:
    # Tests call SessionService.sweep() themselves.
    sweep-enabled: false
  notify:
    # Tests call AttentionNotifier.flush() themselves.
    enabled: false
