logging:
  file:
    name: build/logs/orange.log
  level:
    com.ai.orange: DEBUG

spring:
  application:
    name: orange
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: 30
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

orange:
  worktrees:
    root: ${WORKTREES_ROOT:./.worktrees}
    base-repo: ${WORKTREES_BASE_REPO:}
    # Branch every new worktree is branched off. Should match
    # orange.github.base-branch so worktrees and PRs share a trunk; if the
    # base repo has an `origin` remote, the service fetches this branch
    # before branching so stale local refs never become the base.
    base-branch: ${WORKTREES_BASE_BRANCH:${ORANGE_GITHUB_BASE_BRANCH:main}}
    max-count: ${WORKTREES_MAX_COUNT:20}
    disposer-delay: ${ORANGE_WORKTREE_DISPOSER_DELAY:5m}
    disposer-initial-delay: ${ORANGE_WORKTREE_DISPOSER_INITIAL_DELAY:1m}
  github:
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    webhook-path: /webhooks/github
  envs:
    # Dev-env leasing is dormant until UI QA runs (v2 plan, PR 8).
    # Compose template the orchestrator runs per leased env. Blank = skip.
    # Compose file should interpolate ORANGE_PORT_WEB / ORANGE_PORT_API /
    # ORANGE_PORT_DB / ORANGE_DATA_DIR / ORANGE_FIXTURE_SET /
    # ORANGE_AUTH_BYPASS_TOKEN env vars.
    compose-file: ${ORANGE_ENV_COMPOSE_FILE:}
    compose-start-timeout: ${ORANGE_ENV_COMPOSE_START_TIMEOUT:5m}
    compose-down-timeout: ${ORANGE_ENV_COMPOSE_DOWN_TIMEOUT:1m}
  routing:
    # Spec §10. Tiers cheapest → most capable; escalation moves one step right.
    tier-order: [small, medium, large]
    tiers:
      # auth: subscription = Claude Code → Anthropic with the Max-plan token (CLAUDE_CODE_OAUTH_TOKEN);
      #       gateway      = LiteLLM virtual key per run (API billing).
      # budget-usd: per-run cap — an estimate for subscription runs, the key's max_budget for gateway runs.
      large:  { model: claude-opus-5-5,   harness: claude-code, auth: subscription, budget-usd: 8 }
      medium: { model: claude-sonnet-5-5, harness: claude-code, auth: subscription, budget-usd: 4 }
      small:  { model: claude-haiku-5-5,  harness: claude-code, auth: subscription, budget-usd: 1 }
    rules:  # first match wins; no difficulty = any
      - { role: planner,     tier: large,  effort: xhigh }
      - { role: reviewer,    tier: large,  effort: high }
      - { role: ci_fixer,    tier: medium, effort: medium }
      - { role: chore,       tier: small,  effort: low }
      - { role: implementer, difficulty: L, tier: large,  effort: high }
      - { role: implementer, difficulty: M, tier: medium, effort: high }
      - { role: implementer, difficulty: S, tier: medium, effort: medium }
    risk:
      min-tier: large
      min-effort: high
      paths: ["**/auth/**", "**/migrations/**", "**/db/migration/**", "**/payments/**", "infra/**", ".github/workflows/**"]
    escalation:
      tier-up-after-failures: 2
      needs-human-after-failures: 3
    small-model: claude-haiku-5-5
  harness:
    # Per-run files (stream log, isolated Claude config). Must stay outside every git worktree.
    run-root: ${ORANGE_RUN_ROOT:${user.home}/.orange/runs}
    claude-code:
      command: [claude]
      # The only host variables a run inherits. Credentials are dropped even if listed here.
      pass-env: [PATH, LANG, LC_ALL, TERM, TMPDIR, HOME, USER]
  gateway:
    # LiteLLM proxy for tiers with auth: gateway (start with: docker compose --profile gateway up -d litellm).
    base-url: ${LITELLM_BASE_URL:http://localhost:4000}
    master-key: ${LITELLM_MASTER_KEY:}
    # Added to a run's timeout to get its virtual key's expiry.
    key-ttl-margin: 30m
  billing:
    # Max-plan token for subscription runs (create with: claude setup-token). Only the claude binary gets it.
    subscription-token: ${CLAUDE_CODE_OAUTH_TOKEN:}
    # Never spill a subscription run onto the API-billed gateway (user decision: no API spend).
    overflow-to-gateway: false
    # USD per million tokens (list prices as of 2026-10), used to estimate and cap subscription runs.
    prices:
      claude-fable-5-1:  { input: 10.00, output: 50.00, cache-read: 0.25, cache-write: 12.50 }
      claude-opus-5-5:   { input: 4.00,  output: 20.00, cache-read: 0.20, cache-write: 5.00 }
      claude-sonnet-5-5: { input: 2.00,  output: 10.00, cache-read: 0.20, cache-write: 2.50 }
      claude-haiku-5-5:  { input: 0.10,  output: 0.50,  cache-read: 0.01, cache-write: 0.125 }
