logging:
  file:
    name: build/logs/orange.log
  level:
    com.ai.orange: DEBUG

spring:
  application:
    name: orange
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: 30
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

orange:
  worktrees:
    # Outside every repository (v2 decision 15): one directory per task, named by its id.
    root: ${WORKTREES_ROOT:${user.home}/.orange/worktrees}
    base-repo: ${WORKTREES_BASE_REPO:}
    # Branch every new worktree is branched off. Should match
    # orange.github.base-branch so worktrees and PRs share a trunk; if the
    # base repo has an `origin` remote, the service fetches this branch
    # before branching so stale local refs never become the base.
    base-branch: ${WORKTREES_BASE_BRANCH:${ORANGE_GITHUB_BASE_BRANCH:main}}
    max-count: ${WORKTREES_MAX_COUNT:20}
    disposer-delay: ${ORANGE_WORKTREE_DISPOSER_DELAY:5m}
    disposer-initial-delay: ${ORANGE_WORKTREE_DISPOSER_INITIAL_DELAY:1m}
  github:
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    webhook-path: /webhooks/github
  envs:
    # Dev-env leasing is dormant until UI QA runs (v2 plan, PR 8).
    # Compose template the orchestrator runs per leased env. Blank = skip.
    # Compose file should interpolate ORANGE_PORT_WEB / ORANGE_PORT_API /
    # ORANGE_PORT_DB / ORANGE_DATA_DIR / ORANGE_FIXTURE_SET /
    # ORANGE_AUTH_BYPASS_TOKEN env vars.
    compose-file: ${ORANGE_ENV_COMPOSE_FILE:}
    compose-start-timeout: ${ORANGE_ENV_COMPOSE_START_TIMEOUT:5m}
    compose-down-timeout: ${ORANGE_ENV_COMPOSE_DOWN_TIMEOUT:1m}
  routing:
    # Spec §10. Tiers cheapest → most capable; escalation moves one step right.
    tier-order: [small, medium, large]
    tiers:
      # auth: subscription = Claude Code → Anthropic with the Max-plan token (CLAUDE_CODE_OAUTH_TOKEN);
      #       gateway      = LiteLLM virtual key per run (API billing).
      # budget-usd: per-run cap — an estimate for subscription runs, the key's max_budget for gateway runs.
      large:  { model: claude-opus-5-5,   harness: claude-code, auth: subscription, budget-usd: 8 }
      medium: { model: claude-sonnet-5-5, harness: claude-code, auth: subscription, budget-usd: 4 }
      small:  { model: claude-haiku-5-5,  harness: claude-code, auth: subscription, budget-usd: 1 }
    rules:  # first match wins; no difficulty = any
      - { role: planner,     tier: large,  effort: xhigh }
      # diff_review runs (project-space §3: verify-review routes small or medium at low effort)
      - { role: reviewer,    tier: medium, effort: low }
      # judge runs: one per session stop, so small and quick (project-space §7)
      - { role: judge,       tier: small,  effort: low }
      # brief runs: twice a day and on demand; the ranking is the product (project-space §3)
      - { role: brief,       tier: medium, effort: low }
      - { role: ci_fixer,    tier: medium, effort: medium }
      - { role: chore,       tier: small,  effort: low }
      - { role: implementer, difficulty: L, tier: large,  effort: high }
      - { role: implementer, difficulty: M, tier: medium, effort: high }
      - { role: implementer, difficulty: S, tier: medium, effort: medium }
    risk:
      min-tier: large
      min-effort: high
      paths: ["**/auth/**", "**/migrations/**", "**/db/migration/**", "**/payments/**", "infra/**", ".github/workflows/**"]
    escalation:
      tier-up-after-failures: 2
      needs-human-after-failures: 3
    small-model: claude-haiku-5-5
  runs:
    # The coordinator's run loop (v2 spec §7): scheduler, reactor and reaper. Tests turn it off.
    loop-enabled: ${ORANGE_RUNS_LOOP_ENABLED:true}
    # This instance's id on the runs it claims. Blank = <hostname>-<8 hex>, new at every start, so
    # runs a previous instance left running can be told apart and reaped.
    worker-id: ${ORANGE_WORKER_ID:}
    max-concurrent: 6
    # Concurrent runs per kind. brief stays 0: brief runs start directly, like plans, and take no slot.
    slots: { plan: 1, implement: 4, ci_fix: 2, verify: 2, diff_review: 2, integrate: 1, judge: 2, brief: 0 }
    timeouts: { plan: 30m, implement: 60m, ci_fix: 40m, verify: 30m, diff_review: 20m, integrate: 10m, judge: 5m, brief: 5m }
    # A run's lease is renewed every heartbeat; one not renewed within lease-ttl is reaped.
    lease-ttl: 5m
    heartbeat: 60s
    scheduler-poll: 5s
    reactor-sweep: 30s
    reaper-sweep: 30s
    # Finished runs' directories under orange.harness.run-root are deleted after this long.
    retention: 14d
  mcp:
    # Where agents reach /mcp/worker. Blank = http://127.0.0.1:<server port>/mcp/worker.
    worker-url: ${ORANGE_MCP_WORKER_URL:}
  api:
    # Bearer token for /sessions, /attention, /mcp/steering and /brief (session reporters, steering
    # clients, the latest brief's page; one brief's page also opens with its own key). Blank = open,
    # which is only right while orange listens on localhost.
    token: ${ORANGE_API_TOKEN:}
  attention:
    # Rule-based attention on the user's own sessions (project-space spec, Phase A).
    sweep-enabled: ${ORANGE_ATTENTION_SWEEP_ENABLED:true}
    sweep: 30s
    # A session asking something, or showing a prompt, this long without the user becomes urgent.
    waiting-escalate-after: 15m
    # A session that stopped with nothing to ask is filed after this long ...
    idle-after: 15m
    # ... as normal (it waits for the brief) or urgent (it is pushed).
    idle-stop-urgency: normal
    # A waiting session not heard from for this long is left alone (it probably died without saying so).
    stale-after: 12h
  judge:
    # The session judge (project-space spec, Phase B): at a stop, a short run decides whether orange
    # answers the session itself, the user must decide, or nothing is asked. Off = Phase A's rules.
    enabled: ${ORANGE_JUDGE_ENABLED:true}
    # How long a stop hook waits for the verdict before the session just stops.
    hook-wait: 10m
    # orange answers a session at most this many times in a row without the user; then it escalates.
    max-auto-continues: 5
    # A verdict no stop hook picked up within this long is expired; its answer goes to the inbox.
    pickup-grace: 2m
    # A judge run that has not started within this long is given up; the stop follows the rules.
    start-grace: 60s
  brief:
    # The focus brief (project-space spec, Phase D): at each brief time (the brief-times convention)
    # orange reads where the active projects stand and a short run adds what to focus on.
    # Off = no scheduled briefs; orange_focus still writes one when asked.
    enabled: ${ORANGE_BRIEF_ENABLED:true}
    # How often the schedule is looked at.
    sweep: 60s
    # A missed brief time is still briefed, and a brief still pushed, this long after it.
    catch-up: 2h
    # How far back the first brief looks; later ones cover what happened since the one before.
    first-window: 24h
    # orange_focus writes a fresh brief at most this often ...
    fresh-min-interval: 10m
    # ... and waits this long for it.
    focus-wait: 60s
    # Where a phone reaches orange, e.g. https://orange.example.net. Blank = the push carries no link.
    public-url: ${ORANGE_PUBLIC_URL:}
    # How long the key in a brief's link opens its page.
    link-ttl: 48h
    # Briefs older than this are deleted (their snapshots hold session text).
    retention: 30d
  notify:
    enabled: ${ORANGE_NOTIFY_ENABLED:true}
    sweep: 30s
    # At most one push of urgent items per window; critical items always go at once.
    batch-window: 10m
    # The user's time zone for quiet hours, e.g. Europe/Berlin. Blank = the coordinator's.
    zone: ${ORANGE_NOTIFY_ZONE:}
    ntfy:
      # No pushes while the url is blank. On a public server the topic's name is the secret.
      url: ${ORANGE_NTFY_URL:}
      attention-topic: ${ORANGE_NTFY_ATTENTION_TOPIC:attention}
      # The focus brief goes to a topic of its own, so the phone can ring differently for it.
      brief-topic: ${ORANGE_NTFY_BRIEF_TOPIC:brief}
      token: ${ORANGE_NTFY_TOKEN:}
  conventions:
    # Global defaults of the conventions (project-space spec §8). A project's space and a session's
    # overrides take precedence; brief-times and quiet-hours are global only.
    # What closing a session's work takes: committed, evidence (the project's evidence commands and a
    # diff review pass), integrated. A project sets its own commands in its "evidence" convention;
    # orange only proposes them.
    done: [evidence, integrated]
    # merge (rebase, fast-forward the base, push it when there is an origin), branch (leave it),
    # ask (the user integrates), pr (not built: treated as ask). "remote-push: false" keeps it local.
    integration: merge
    auto-answer: routine
    always-ask: []
    auto-answer-confidence: 0.8
    brief-times: ["09:00", "14:00"]
    # Only critical items are pushed between these two times.
    quiet-hours: ["22:00", "08:00"]
  events:
    # The inbox (webhooks and session events): stored first, then processed one per transaction in id order.
    processing-enabled: ${ORANGE_EVENTS_PROCESSING_ENABLED:true}
    poll: 5s
    # A failing event is retried this many times, then left with its last error.
    max-attempts: 5
  evidence:
    # Commands orange runs itself, in a task's worktree at its head, before the task can count as
    # verified (project-space spec §7). This list is for orange's own tasks; a session's work is
    # checked with its project's "evidence" convention. Commands get only the harness's allowlisted
    # environment. Each entry:
    #   - { kind: tests|build|lint|custom, command: "./gradlew test", timeout: 20m }
    commands: []
    # How much of each command's output (its end) an evidence row keeps.
    output-tail-chars: 4000
  integration:
    # Merge mode: rebase, re-verify if that changed the head, fast-forward the base. Push the base
    # when the base repo has an origin remote, unless this is false.
    remote-push: ${ORANGE_INTEGRATION_REMOTE_PUSH:true}
  harness:
    # Per-run files (stream log, isolated Claude config). Must stay outside every git worktree.
    run-root: ${ORANGE_RUN_ROOT:${user.home}/.orange/runs}
    claude-code:
      command: [claude]
      # The only host variables a run inherits. Credentials are dropped even if listed here.
      pass-env: [PATH, LANG, LC_ALL, TERM, TMPDIR, HOME, USER]
  gateway:
    # LiteLLM proxy for tiers with auth: gateway (start with: docker compose --profile gateway up -d litellm).
    base-url: ${LITELLM_BASE_URL:http://localhost:4000}
    master-key: ${LITELLM_MASTER_KEY:}
    # Added to a run's timeout to get its virtual key's expiry.
    key-ttl-margin: 30m
    # The admin client's timeouts, so a hung proxy fails the call instead of holding a run.
    connect-timeout: 5s
    read-timeout: 30s
  billing:
    # Max-plan token for subscription runs (create with: claude setup-token). Only the claude binary gets it.
    subscription-token: ${CLAUDE_CODE_OAUTH_TOKEN:}
    # Never spill a subscription run onto the API-billed gateway (user decision: no API spend).
    overflow-to-gateway: false
    # USD per million tokens (list prices as of 2026-10), used to estimate and cap subscription runs.
    prices:
      claude-fable-5-1:  { input: 10.00, output: 50.00, cache-read: 0.25, cache-write: 12.50 }
      claude-opus-5-5:   { input: 4.00,  output: 20.00, cache-read: 0.20, cache-write: 5.00 }
      claude-sonnet-5-5: { input: 2.00,  output: 10.00, cache-read: 0.20, cache-write: 2.50 }
      claude-haiku-5-5:  { input: 0.10,  output: 0.50,  cache-read: 0.01, cache-write: 0.125 }
