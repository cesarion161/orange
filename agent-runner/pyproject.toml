[project]
name = "agent-runner"
version = "0.1.0"
description = "Sidecar that wraps the Claude Agent SDK and speaks NDJSON over stdio with the orange orchestrator."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "anyio>=4.6",
]

[project.scripts]
agent-runner = "agent_runner.__main__:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runner"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
