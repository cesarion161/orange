[project]
name = "orange-mcp"
version = "0.1.0"
description = "MCP server that lets Claude Code drive the orange-ai orchestrator (plan, list, tail, cancel, etc.)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.scripts]
orange-mcp = "orange_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orange_mcp"]
